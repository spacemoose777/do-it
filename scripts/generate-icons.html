<!DOCTYPE html>
<html>
<head><title>Do It - Icon Generator</title></head>
<body style="background:#333; padding:40px;">
<h2 style="color:white">Open this file in a browser, then right-click each icon and "Save Image As"</h2>
<h3 style="color:white">Save as: public/icons/icon-192.png</h3>
<canvas id="icon192" width="192" height="192"></canvas>
<h3 style="color:white">Save as: public/icons/icon-512.png</h3>
<canvas id="icon512" width="512" height="512"></canvas>
<h3 style="color:white">Save as: public/icons/icon-maskable.png (same as 512)</h3>

<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;

  // Background
  ctx.fillStyle = '#0f0f13';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();

  // Checkmark circle
  const cx = s * 0.5;
  const cy = s * 0.45;
  const r = s * 0.22;

  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = s * 0.04;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Checkmark
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = s * 0.05;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.4, cy);
  ctx.lineTo(cx - r * 0.05, cy + r * 0.35);
  ctx.lineTo(cx + r * 0.45, cy - r * 0.3);
  ctx.stroke();

  // Text "Do It"
  ctx.fillStyle = '#e8e8ed';
  ctx.font = `bold ${s * 0.12}px Inter, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Do It', cx, cy + r + s * 0.15);
}

drawIcon(document.getElementById('icon192'));
drawIcon(document.getElementById('icon512'));
</script>
</body>
</html>
